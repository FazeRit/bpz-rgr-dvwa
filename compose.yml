networks:
  dvwa_internal:
    internal: true
  dvwa_edge: {}

x-db: &db
  image: docker.io/library/mariadb:10
  environment:
    - MYSQL_ROOT_PASSWORD=dvwa
    - MYSQL_DATABASE=dvwa
    - MYSQL_USER=dvwa
    - MYSQL_PASSWORD=p@ssw0rd
  networks: [dvwa_internal]

services:
  dvwa-fixed:
    build: ./target
    image: bpz-dvwa:fixed
    environment: [DB_SERVER=db-fixed, DEFAULT_SECURITY_LEVEL=low]
    depends_on: [db-fixed]
    networks: [dvwa_internal]
  db-fixed: *db

  dvwa-vuln:
    build: ./.baseline/target
    image: bpz-dvwa:vuln
    environment: [DB_SERVER=db-vuln, DEFAULT_SECURITY_LEVEL=low]
    depends_on: [db-vuln]
    networks: [dvwa_internal]
  db-vuln: *db

  gateway:
    image: docker.io/library/nginx:1.27-alpine
    volumes: ["./deploy/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [dvwa-fixed, dvwa-vuln]
    networks: [dvwa_internal, dvwa_edge]
    ports: ["127.0.0.1:4280:4280", "127.0.0.1:4281:4281"]
