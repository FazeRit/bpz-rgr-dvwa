name: security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep
        run: |
          mkdir -p reports
          SEMGREP="docker run --rm -v $PWD:/src -w /src semgrep/semgrep:1.95.0 semgrep scan --metrics=off"
          $SEMGREP --config tools/semgrep/variant8.yml --json --output reports/semgrep-v8.json \
            target/vulnerabilities/upload target/vulnerabilities/fi \
            target/vulnerabilities/view_source.php target/vulnerabilities/view_source_all.php \
            target/vulnerabilities/view_help.php || true
          $SEMGREP --config p/php --config p/security-audit --json --output reports/semgrep.json target || true
      - uses: actions/upload-artifact@v4
        with: {name: sast, path: reports}

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy and CycloneDX SBOM
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD:/src" aquasec/trivy:0.58.1 fs --scanners vuln --format json --output /src/reports/trivy.json /src/target || true
          docker run --rm -v "$PWD:/src" aquasec/trivy:0.58.1 fs --format cyclonedx --output /src/reports/sbom.json /src/target || true
      - uses: actions/upload-artifact@v4
        with: {name: sca, path: reports}

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gitleaks
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD:/src" -w /src zricethezav/gitleaks:v8.21.2 dir . --gitleaks-ignore-path .gitleaksignore --report-format json --report-path reports/gitleaks.json --exit-code 0 || true
      - uses: actions/upload-artifact@v4
        with: {name: secrets, path: reports}

  gate:
    runs-on: ubuntu-latest
    needs: [sast, sca, secrets]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: reports, merge-multiple: true}
      - name: Quality gate
        run: python3 tools/gate.py
